# Build da imagem da API e push para o Artifact Registry.

substitutions:
  _AR_HOSTNAME: us-central1-docker.pkg.dev
  _AR_PROJECT_ID: manu-auth
  _AR_REPOSITORY: cloud-run-source-deploy
  _DEPLOY_REGION: us-central1
  _SERVICE_NAME: tolkien-retriever-api

steps:
  - id: build-push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}"
        TAG="${SHORT_SHA}"
        if [ -z "$${TAG}" ]; then TAG="manual-$$(date +%Y%m%d-%H%M%S)"; fi
        echo "$${TAG}" > /workspace/_tag.txt

        docker buildx create --name builder --driver docker-container --use \
          2>/dev/null || docker buildx use builder
        docker buildx build \
          --tag "$${IMAGE}:$${TAG}" \
          --tag "$${IMAGE}:latest" \
          --push \
          .

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}"
        gcloud run deploy ${_SERVICE_NAME} \
          --image "$${IMAGE}:$$(cat /workspace/_tag.txt)" \
          --region ${_DEPLOY_REGION} \
          --quiet

options:
  substitution_option: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY
